<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>每日收盘复盘</title>
<style>
:root{--bg:#f4f7fa;--surface:#fff;--ink:#183047;--muted:#64748b;--line:#dbe4ec;--blue:#2474b5;--green:#19704b;--red:#aa2c2c;--amber:#966100;--soft:#eaf2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{background:#19324a;color:#fff;padding:24px max(20px,calc((100% - 1180px)/2)) 18px}h1{margin:0;font-size:26px}header p{margin:4px 0 0;color:#cbd9e5}.wrap{max-width:1180px;margin:auto;padding:20px}.toolbar,.summary,.detail-grid{display:flex;gap:12px;flex-wrap:wrap}.toolbar{align-items:end;margin-bottom:14px}.field{display:grid;gap:4px}.field label{font-size:12px;color:var(--muted)}select,input,textarea,button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);color:var(--ink)}button{cursor:pointer}.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 15px;min-width:145px}.stat b{display:block;font-size:22px}.stat span,.sub{color:var(--muted);font-size:12px}.notice{margin:14px 0;padding:10px 12px;background:#fff4d6;border-left:4px solid #d6a72e}.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:#e9f0f5;font-size:12px}td.num{text-align:right;font-variant-numeric:tabular-nums}.up{color:var(--red)}.down{color:var(--green)}.strong{color:var(--green)}.weak{color:var(--red)}.neutral{color:var(--amber)}tr[data-code]{cursor:pointer}tr[data-code]:hover,tr.selected{background:#f0f7fb}.detail{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}.detail h2{margin:0}.detail-grid>section{flex:1 1 280px}.detail h3{font-size:15px;margin:15px 0 5px}ul{margin:4px 0;padding-left:20px}.chart{width:100%;height:210px;border:1px solid var(--line);border-radius:7px;background:#fbfdff}.plan{background:var(--soft);padding:12px;border-radius:7px}.danger{background:#fdecec;padding:12px;border-radius:7px}.note-area{width:100%;min-height:90px}.foot{margin:20px 0;color:var(--muted);font-size:12px}@media(max-width:620px){header{padding:18px 16px}.wrap{padding:12px}.stat{min-width:calc(50% - 6px)}h1{font-size:22px}}
</style></head><body>
<header><h1>每日收盘复盘</h1><p id="asof">正在读取数据……</p></header>
<main class="wrap"><div class="toolbar"><div class="field"><label for="group">观察组</label><select id="group"><option value="">全部</option></select></div><div class="field"><label for="status">技术状态</label><select id="status"><option value="">全部</option><option>偏强</option><option>震荡/待确认</option><option>偏弱</option></select></div><div class="field"><label for="search">名称或代码</label><input id="search" placeholder="输入名称或代码"></div><button id="reset">清除筛选</button></div>
<div class="summary"><div class="stat"><span>偏强</span><b id="nStrong">—</b></div><div class="stat"><span>待确认</span><b id="nNeutral">—</b></div><div class="stat"><span>偏弱</span><b id="nWeak">—</b></div><div class="stat"><span>当日平均涨跌</span><b id="avg">—</b></div></div>
<div class="notice"><b>使用方法：</b>每天收盘后双击上一级文件夹里的“更新并打开每日复盘.cmd”。网页先给出规则化筛查，再由你结合行业、公司消息和持仓成本做最终判断。</div>
<div class="table-wrap"><table><thead><tr><th>品种</th><th>组别</th><th>收盘</th><th>当日</th><th>20日</th><th>量/10日均量</th><th>位置</th><th>状态</th><th>次日原则</th></tr></thead><tbody id="rows"></tbody></table></div>
<article class="detail" id="detail"><p>点击上表任意品种查看判断依据和次日计划。</p></article>
<p class="foot" id="method"></p></main><script src="data.js"></script><script>
const D=window.REVIEW_DATA||{items:[]};let selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(v){return v>0?'up':v<0?'down':''}function scls(s){return s==='偏强'?'strong':s==='偏弱'?'weak':'neutral'}function fmt(v,d=2){return Number(v).toFixed(d)}
function drawChart(el,series){const w=900,h=210,p=28,vals=series.map(x=>x.c),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1,pts=series.map((x,i)=>`${p+i*(w-2*p)/(series.length-1)},${h-p-(x.c-mn)*(h-2*p)/range}`).join(' ');el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="最近60个交易日收盘价"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#dbe4ec"/><polyline points="${pts}" fill="none" stroke="#2474b5" stroke-width="3"/><text x="${p}" y="18" fill="#64748b">${mx.toFixed(2)}</text><text x="${p}" y="${h-7}" fill="#64748b">${mn.toFixed(2)}</text></svg>`}
function renderDetail(x){selected=x.code;const note=localStorage.getItem('note-'+x.code)||'';const freshness=x.stale?'｜注意：本次更新失败，显示上次成功数据':'';$('#detail').innerHTML=`<div><h2>${esc(x.name)} <span class="sub">${x.code} · ${x.date}</span></h2><p class="sub">数据源：${esc(x.dataSource||'历史版本未记录')}${esc(freshness)}</p><p><b class="${scls(x.status)}">${x.status}</b>｜${esc(x.action)}</p></div><div class="detail-grid"><section><div class="chart" id="chart"></div><h3>判断依据</h3><ul>${x.reasons.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><h3>风险与反证</h3><div class="danger"><ul>${x.risks.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div></section><section><h3>关键数字</h3><ul><li>MA21 / MA34 / MA60：${x.ma['21']} / ${x.ma['34']} / ${x.ma['60']}</li><li>BBI：${x.bbi}</li><li>MACD 柱：${x.macd.hist}（前值 ${x.macd.histPrev}）</li><li>KDJ-J：${x.kdjJ}；BIAS55：${x.bias55}%</li><li>20 日区间：${x.low20}—${x.hi20}，当前位置 ${x.pos20}%</li></ul><h3>次日计划</h3><div class="plan"><b>${esc(x.action)}</b><ul>${x.nextWatch.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p>只有出现计划中的确认信号才行动；若跌破结构位且次日无法收回，优先减风险。</p></div><h3>我的补充记录</h3><textarea class="note-area" id="note" placeholder="记录持仓成本、仓位、公司消息或自己的判断……">${esc(note)}</textarea><button id="saveNote">保存记录</button></section></div>`;drawChart($('#chart'),x.series);$('#saveNote').onclick=()=>{localStorage.setItem('note-'+x.code,$('#note').value);$('#saveNote').textContent='已保存'};document.querySelectorAll('tr').forEach(r=>r.classList.toggle('selected',r.dataset.code===x.code))}
function render(){let xs=D.items||[];const g=$('#group').value,s=$('#status').value,q=$('#search').value.trim().toLowerCase();xs=xs.filter(x=>(!g||x.group===g)&&(!s||x.status===s)&&(!q||x.name.toLowerCase().includes(q)||x.code.includes(q)));$('#rows').innerHTML=xs.map(x=>`<tr data-code="${x.code}"><td><b>${esc(x.name)}</b><div class="sub">${x.code}</div></td><td>${esc(x.group)}</td><td class="num">${fmt(x.close,3)}</td><td class="num ${cls(x.pct)}">${x.pct>0?'+':''}${fmt(x.pct)}%</td><td class="num ${cls(x.ret20)}">${x.ret20>0?'+':''}${fmt(x.ret20)}%</td><td class="num">${fmt(x.volRatio)}×</td><td class="num">${fmt(x.pos20,1)}%</td><td class="${scls(x.status)}">${x.status}</td><td>${esc(x.action)}</td></tr>`).join('');document.querySelectorAll('tr[data-code]').forEach(r=>r.onclick=()=>renderDetail(D.items.find(x=>x.code===r.dataset.code)));if(selected){const x=D.items.find(x=>x.code===selected);if(x)renderDetail(x)}}
function init(){const groups=[...new Set(D.items.map(x=>x.group))];$('#group').innerHTML+groups.map(x=>`<option>${esc(x)}</option>`).join('');const st=D.items.filter(x=>x.status==='偏强').length,ne=D.items.filter(x=>x.status==='震荡/待确认').length,we=D.items.filter(x=>x.status==='偏弱').length;$('#nStrong').textContent=st;$('#nNeutral').textContent=ne;$('#nWeak').textContent=we;const av=D.items.reduce((a,x)=>a+x.pct,0)/(D.items.length||1);$('#avg').textContent=(av>0?'+':'')+fmt(av)+'%';$('#avg').className=cls(av);$('#asof').textContent=`行情日期 ${D.marketDate||'未知'}｜生成时间 ${D.generatedAt||'未知'}｜${D.source||''}`;$('#method').textContent=D.method||'';['group','status','search'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#reset').onclick=()=>{$('#group').value='';$('#status').value='';$('#search').value='';render()};render();if(D.items[0])renderDetail(D.items[0])}init();
</script></body></html>
